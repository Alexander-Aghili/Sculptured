# Copied from OpenRig (Apache-2.0) at commit a9d3e05, packages/daemon/specs/rigs/launch/first-project/rig.yaml
version: "0.2"
name: first-project
summary: >
  Two Codex seats in your repository: an outcome owner and an independent
  checker. Give the owner one bounded change; follow the durable result and
  continue at the same address. See docs/reference/getting-started.md.

culture_file: CULTURE.md

pods:
  - id: dev
    label: Project
    members:
      - id: owner
        agent_ref: "local:../../../agents/development/implementer"
        runtime: codex
        model: gpt-6-astra
        profile: default
        cwd: "."
      - id: check
        agent_ref: "local:../../../agents/development/qa"
        runtime: codex
        model: gpt-6-astra
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: owner
        to: check

edges: []
