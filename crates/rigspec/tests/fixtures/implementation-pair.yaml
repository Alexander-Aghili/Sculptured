# Copied from OpenRig (Apache-2.0) at commit a9d3e05, packages/daemon/specs/rigs/launch/implementation-pair/rig.yaml
version: "0.2"
name: implementation-pair
summary: >
  A focused development pair providing implementation and QA capabilities.
  Project/mission/slice components choose the work and any independent checks;
  no composition means light Part A, not a per-edit approval loop.

pods:
  - id: dev
    label: Development Pair
    members:
      - id: impl
        agent_ref: "local:../../../agents/development/implementer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: qa
        agent_ref: "local:../../../agents/development/qa"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: impl
        to: qa

edges: []
