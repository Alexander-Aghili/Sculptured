[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Alexander-Aghili/sculptured"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
rigspec = { path = "crates/rigspec" }
drivers = { path = "crates/drivers" }
host-proto = { path = "crates/host-proto" }
hostd = { path = "crates/hostd" }
controld = { path = "crates/controld" }
signing = { path = "crates/signing" }
localops = { path = "crates/localops" }
interpreter = { path = "crates/interpreter" }
# MAIS (where a run's tokens went): pinned by git revision once its repository is published.
mais = { path = "../../MAIS/crates/mais" }
madl = { git = "https://github.com/Alexander-Aghili/Multi-Agent-Descriptor-Language", rev = "ea9c2dd849ab41367b0cccbba86d613dadcf276d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
tempfile = "3"
http-body-util = "0.1"

[workspace.lints.clippy]
too_many_lines = "warn"

# Line tables keep backtraces readable; full debug info made test builds ~15 GB on a nearly full disk.
[profile.dev]
debug = "line-tables-only"
